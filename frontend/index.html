<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amalwebsite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }

    #crosshair::before {
      width: 100%;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }

    #crosshair::after {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    .exp-card {
      position: fixed;
      left: 24px;
      bottom: 24px;
      max-width: min(420px, calc(100vw - 48px));
      padding: 16px 20px;
      border-left: 6px solid var(--accent, #fff);
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      color: #f1f1f1;
      font: 15px/1.45 system-ui, sans-serif;
      pointer-events: none;
    }

    .exp-card h2 { margin: 0 0 4px; font-size: 20px; }
    .exp-card p { margin: 0 0 8px; }
    .exp-card ul { margin: 0 0 10px; padding-left: 18px; }
    .exp-card__stop { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .exp-card__meta { color: #b8bcc8; }
    .exp-card__hint { margin: 0; font-size: 13px; color: #b8bcc8; }

    .range-hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #f1f1f1;
      font: 15px/1.45 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    .range-hud[hidden], .range-hud__toast[hidden] { display: none; }
    .range-hud__tally {
      margin: 0;
      padding: 6px 16px;
      border-bottom: 3px solid #ff6b2c;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .range-hud__toast { margin: 0; font-size: 22px; font-weight: 700; color: #ffd166; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
    .range-hud__hint { margin: 0; font-size: 13px; color: #b8bcc8; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
