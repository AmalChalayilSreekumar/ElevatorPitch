<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amalwebsite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }

    #crosshair::before {
      width: 100%;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }

    #crosshair::after {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    .exp-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(640px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 28px 36px 24px;
      border-top: 8px solid var(--accent, #fff);
      border-radius: 12px;
      background: rgba(15, 18, 30, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      color: #f1f1f1;
      font: 17px/1.5 system-ui, sans-serif;
      pointer-events: none;
      animation: exp-card-in 0.35s ease-out;
    }

    @keyframes exp-card-in {
      from { opacity: 0; transform: translate(-50%, -46%); }
    }

    .exp-card p { margin: 0 0 12px; }
    .exp-card ul { margin: 0 0 18px; padding-left: 20px; }
    .exp-card li { margin-bottom: 4px; }
    .exp-card__stop { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #b8bcc8; }
    .exp-card__role {
      margin: 0 0 6px;
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: #f1f1f1;
    }
    .exp-card__company { margin: 0 0 4px; font-size: 22px; font-weight: 600; color: var(--accent); }
    .exp-card__meta { padding-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); color: #b8bcc8; }
    .exp-card__hint { margin: 0; font-size: 14px; text-align: center; color: #b8bcc8; }

    .prompt {
      position: fixed;
      inset: 0;
      background: rgba(255, 130, 40, 0.2);
      pointer-events: none;
      animation: prompt-fade 0.5s ease-out;
    }

    .prompt[hidden] { display: none; }

    .prompt__text {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      color: #f1f1f1;
      font: 16px/1.45 system-ui, sans-serif;
      white-space: nowrap;
      animation: prompt-rise 0.4s ease-out;
    }

    @keyframes prompt-fade {
      from { opacity: 0; }
    }

    @keyframes prompt-rise {
      from { transform: translate(-50%, 8px); }
    }

    .range-hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #f1f1f1;
      font: 15px/1.45 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    .range-hud[hidden], .range-hud__toast[hidden] { display: none; }
    .range-hud__tally {
      margin: 0;
      padding: 6px 16px;
      border-bottom: 3px solid #ff6b2c;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .range-hud__toast { margin: 0; font-size: 22px; font-weight: 700; color: #ffd166; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
    .range-hud__hint { margin: 0; font-size: 13px; color: #b8bcc8; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
  </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
