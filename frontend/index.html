<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amalwebsite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    /* The hidden attribute always wins, whatever display a component's layout sets. */
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }

    #crosshair::before {
      width: 100%;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }

    #crosshair::after {
      width: 2px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    .exp-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(640px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 28px 36px 24px;
      border-top: 8px solid var(--accent, #fff);
      border-radius: 12px;
      background: rgba(15, 18, 30, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      color: #f1f1f1;
      font: 17px/1.5 system-ui, sans-serif;
      pointer-events: none;
      animation: exp-card-in 0.35s ease-out;
    }

    @keyframes exp-card-in {
      from { opacity: 0; transform: translate(-50%, -46%); }
    }

    .exp-card p { margin: 0 0 12px; }
    .exp-card ul { margin: 0 0 18px; padding-left: 20px; }
    .exp-card li { margin-bottom: 4px; }
    .exp-card__stop { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #b8bcc8; }
    .exp-card__role {
      margin: 0 0 6px;
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: #f1f1f1;
    }
    .exp-card__company { margin: 0 0 4px; font-size: 22px; font-weight: 600; color: var(--accent); }
    .exp-card__meta { padding-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); color: #b8bcc8; }
    .exp-card__hint { margin: 0; font-size: 14px; text-align: center; color: #b8bcc8; }

    /* Mobile: everything scales with the screen, and the card stays clear of the Continue button below it. */
    .touch-mode .exp-card {
      top: calc(50% - 36px);
      width: min(720px, calc(100vw - 32px));
      max-height: calc(100vh - 104px);
      max-height: calc(100dvh - 104px);
      padding: clamp(12px, 3vh, 24px) clamp(14px, 4vw, 28px);
      border-top-width: 6px;
      font-size: clamp(13px, 1.6vh + 0.6vw, 16px);
    }
    .touch-mode .exp-card p { margin-bottom: clamp(4px, 1.2vh, 10px); }
    .touch-mode .exp-card ul { margin-bottom: clamp(6px, 1.5vh, 14px); }
    .touch-mode .exp-card li { margin-bottom: 2px; }
    .touch-mode .exp-card__stop { font-size: 0.75em; }
    .touch-mode .exp-card__role { font-size: clamp(20px, 3vh + 1.4vw, 36px); }
    .touch-mode .exp-card__company { font-size: clamp(15px, 1.8vh + 0.8vw, 20px); }
    .touch-mode .exp-card__meta { padding-bottom: clamp(6px, 1.5vh, 12px); }
    .touch-mode .exp-card__hint { font-size: 0.85em; }

    /* Landscape phones have width to spare but little height: put the job's details beside its title. */
    @media (orientation: landscape) {
      .touch-mode .exp-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
        column-gap: clamp(16px, 3vw, 28px);
        align-items: start;
      }
      .touch-mode .exp-card__meta { margin-bottom: 0; border-bottom: 0; }
      .touch-mode .exp-card__body { padding-left: clamp(16px, 3vw, 28px); border-left: 1px solid rgba(255, 255, 255, 0.12); }
      .touch-mode .exp-card__hint { grid-column: 1 / -1; }
    }

    /* Very short screens (small phones sideways): tighter type, and the hint repeats the Continue button anyway. */
    @media (orientation: landscape) and (max-height: 360px) {
      .touch-mode .exp-card { font-size: 12px; line-height: 1.4; }
      .touch-mode .exp-card__role { font-size: 18px; }
      .touch-mode .exp-card__company { font-size: 14px; }
      .touch-mode .exp-card__hint { display: none; }
    }

    .prompt {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }


    .prompt__text {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      color: #f1f1f1;
      width: max-content;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      font: 16px/1.45 system-ui, sans-serif;
      text-align: center;
      white-space: pre-line;
      animation: prompt-rise 0.4s ease-out;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: 8px 16px;
      border-bottom: 3px solid #ff8228;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      color: #f1f1f1;
      font: 15px/1.45 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
      animation: prompt-fade 0.25s ease-out;
    }


    .prompt__actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .prompt__action,
    .return-chip {
      padding: 8px 14px;
      border: 1px solid rgba(241, 241, 241, 0.5);
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      color: #f1f1f1;
      font: 600 14px/1.2 system-ui, sans-serif;
      pointer-events: auto;
      touch-action: manipulation;
      cursor: pointer;
    }

    .prompt__text--closable {
      padding-right: 40px;
    }

    .prompt__close {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: none;
      color: #b8bcc8;
      font: 22px/1 system-ui, sans-serif;
      pointer-events: auto;
      touch-action: manipulation;
      cursor: pointer;
    }

    .prompt__close:hover { color: #f1f1f1; }

    .return-chip {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
    }


    @keyframes prompt-fade {
      from { opacity: 0; }
    }

    @keyframes prompt-rise {
      from { transform: translate(-50%, 8px); }
    }

    .range-hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #f1f1f1;
      font: 15px/1.45 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    .range-hud__tally {
      margin: 0;
      padding: 6px 16px;
      border-bottom: 3px solid #ff6b2c;
      border-radius: 8px;
      background: rgba(15, 18, 30, 0.85);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .range-hud__toast { margin: 0; font-size: 22px; font-weight: 700; color: #ffd166; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
    .range-hud__hint { margin: 0; font-size: 13px; color: #b8bcc8; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }

    .range-callout {
      position: fixed;
      top: calc(50% + 40px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      margin: 0;
      padding: 8px 16px;
      border: 2px solid #ffd166;
      border-radius: 10px;
      background: rgba(15, 18, 30, 0.88);
      color: #ffd166;
      font: 700 16px/1.35 system-ui, sans-serif;
      text-align: center;
      text-wrap: balance;
      pointer-events: none;
      animation: range-callout-in 0.3s ease-out, range-callout-bob 1.4s ease-in-out 0.3s infinite;
    }


    @keyframes range-callout-in {
      from { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
    }

    @keyframes range-callout-bob {
      50% { transform: translate(-50%, -4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .range-callout { animation: none; }
    }
  </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
